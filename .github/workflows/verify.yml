name: Verify Photobooth
on:
  push:
    branches: [main, feat/photobooth-redesign-vps]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check && npm run lint && npm test && npm audit && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test production server
        run: |
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          PORT=3020 HOSTNAME=0.0.0.0 node .next/standalone/server.js &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3020/api/health && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photobooth-verification
          path: |
            playwright-report/
            output/
