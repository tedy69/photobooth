limit_req_zone $binary_remote_addr zone=photobooth_support:1m rate=5r/m;
server {
    listen 80;
    listen [::]:80;
    server_name photobooth.tedyfazrin.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name photobooth.tedyfazrin.com;
    ssl_certificate /srv/tedyfazrin/photobooth-ingress/tls/fullchain.pem;
    ssl_certificate_key /srv/tedyfazrin/photobooth-ingress/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/support {
        limit_req zone=photobooth_support burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://172.18.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / {
        proxy_pass http://172.18.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
